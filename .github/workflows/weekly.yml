name: Weekly Intelligence Run

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      competitors:
        description: "Comma-separated competitor list (leave empty for defaults)"
        required: false
        default: ""

jobs:
  run-pipeline:
    name: Run CompeteIQ Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directories
        run: mkdir -p data/chroma

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CHROMA_PERSIST_DIR: "./data/chroma"
          SQLITE_DB_PATH: "./data/competeiq.db"
          DEFAULT_COMPETITORS: ${{ github.event.inputs.competitors || 'Anthropic,Google,Meta,Mistral,Perplexity' }}
          LOG_LEVEL: "INFO"
        run: python main.py

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-run-${{ github.run_id }}
          path: |
            data/competeiq.db
          retention-days: 30
