# docker compose up --build          -> API on :8000, dashboard on :8501
# docker compose run --rm api python main.py   -> one pipeline run into the same volume
services:
  api:
    build: .
    image: competeiq:latest
    env_file:
      - path: .env          # OPENAI_API_KEY, TAVILY_API_KEY, tuning; optional so `up` works for a read-only look
        required: false
    environment:
      # Pin storage inside the shared volume, whatever .env says.
      DATA_DIR: /app/data
      SQLITE_DB_PATH: /app/data/competeiq.db
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - competeiq-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build: .                # same Dockerfile and tag as api; the second build is all cache hits
    image: competeiq:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      # The dashboard only talks to the API (never the DB), over the compose network.
      API_BASE_URL: http://api:8000
      # Only what the UI needs (no OpenAI/Tavily keys); interpolated from .env.
      DEFAULT_COMPETITORS: ${DEFAULT_COMPETITORS:-Anthropic,Google,Meta,Mistral,Perplexity}
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  competeiq-data:
